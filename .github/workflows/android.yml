name: Android

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, persistence tests and lint
        run: bash ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug
      - name: Verify committed Room schemas
        run: |
          git diff --exit-code -- app/schemas
          test -z "$(git ls-files --others --exclude-standard app/schemas)"
      - name: Publish validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: app/build/reports/
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tripmind-debug
          path: app/build/outputs/apk/debug/*.apk
